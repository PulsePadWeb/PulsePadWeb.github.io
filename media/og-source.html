<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "DM Sans"; src: url("./dm-sans.woff2") format("woff2"); font-weight: 400 800; }
@font-face { font-family: "Space Grotesk"; src: url("./space-grotesk.woff2") format("woff2"); font-weight: 400 700; }
@font-face { font-family: "Fraunces"; src: url("./fraunces-italic.woff2") format("woff2"); font-style: italic; font-weight: 600; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #160d2c; }
.card { position: relative; width: 1200px; height: 630px; color: #fff; font-family: "DM Sans", sans-serif;
  background: #160d2c url('./hero.webp') 72% center / auto 118% no-repeat; }
.card::before { content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(18,10,37,.92) 0%, rgba(18,10,37,.6) 42%, rgba(18,10,37,0) 75%); }
.inner { position: absolute; left: 72px; top: 64px; right: 72px; bottom: 0; }
.brand { display: flex; align-items: center; gap: 16px; font-family: "Space Grotesk"; font-weight: 700; font-size: 38px; letter-spacing: -2px; }
.brand img { width: 60px; height: 60px; border-radius: 18px; box-shadow: 0 8px 24px rgba(118,85,220,.5); }
.brand .dot { color: #d9f588; }
.eyebrow { margin-top: 70px; display: flex; align-items: center; gap: 12px; color: #d9edb8; font-size: 15px; font-weight: 800; letter-spacing: 3px; }
.eyebrow i { width: 10px; height: 10px; border-radius: 50%; background: #d9f588; box-shadow: 0 0 14px #d9f588; }
h1 { font-family: "Space Grotesk"; font-weight: 700; font-size: 104px; line-height: .95; letter-spacing: -5.5px; margin: 22px 0 22px; }
h1 em { font-family: "Fraunces"; font-style: italic; font-weight: 600; color: #d9f391; letter-spacing: -2px; word-spacing: 6px; }
p { margin: 0; font-size: 24px; line-height: 1.5; color: #cdc4e0; max-width: 640px; }
.footer { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; padding: 0 72px; display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid rgba(255,255,255,.14); background: rgba(17,9,39,.45); font-size: 14px; font-weight: 800; letter-spacing: 2.6px; color: #bcb0d6; }
.footer b { color: #fff; font-weight: 800; }
.footer .star { color: #b99ce9; margin: 0 10px; }
</style></head>
<body><div class="card"><div class="inner">
  <div class="brand"><img src="./icon.svg" alt=""><span>pulsepad<span class="dot">.</span></span></div>
  <div class="eyebrow"><i></i> THE SOUND EFFECTS COLLECTION</div>
  <h1>Your world.<br><em>Turned up.</em></h1>
  <p>Tap a pad. Press play. Make the moment.</p>
</div>
<div class="footer"><span><b>PULSEPAD.APP</b></span><span>1,798 SOUNDS <span class="star">&#10035;</span> FREE &amp; INSTANT</span></div>
</div></body></html>
